services:
  phoenix:
    image: arizephoenix/phoenix:17.6.0
    ports:
      - "6006:6006" # UI
      - "4317:4317" # OLTP
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-service:dev
    container_name: llm-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
      DATABASE_URL: postgresql+asyncpg://chat:${POSTGRES_PASSWORD:-pswd}@db:5433/intellibase
      # Если вы хотите, чтобы приложение сразу использовало postgres-репозиторий:
      CHAT_REPOSITORY: postgres
    depends_on:
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/ready', timeout=3).status == 200 else sys.exit(1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    container_name: llm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: llm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pswd}
      POSTGRES_DB: intellibase
    ports:
      - "5432:5432"                # для локального доступа, можно убрать в проде
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U chat -d intellibase" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
  phoenix_data:
  postgres_data: