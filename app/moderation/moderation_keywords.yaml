# Блоклист паттернов для Layer 1 каскада модерации.
# Каждый паттерн — регулярное выражение (Python re).
# Файл редактируется без редеплоя: ModerationService перечитывает его при создании.
#
# Структура записи:
#   pattern: "regex-паттерн"
#   reason:  "человекочитаемая причина блокировки"
#   category: "категория нарушения"

patterns:
  - pattern: "(?i)\\b(как\\s+(сделать|собрать|изготовить|купить))\\s+(бомб[уы]|взрывчатк)"
    reason: "Запрос инструкций по изготовлению взрывчатых веществ"
    category: "violence"

  - pattern: "(?i)\\b(взломать|взломай|хакни|хакани|сломай|взлом)\\b"
    reason: "Запрос инструкций по взлому"
    category: "illegal"

  - pattern: "(?i)\\b(наркот|спайс|соль\\s+для\\s+ванн|закладк)"
    reason: "Запрос или упоминание наркотических веществ"
    category: "drugs"

  - pattern: "(?i)\\b(суицид|самоубийств|способы\\s+(покончить|убить)\\s+соб)"
    reason: "Контент, связанный с суицидом"
    category: "self_harm"
