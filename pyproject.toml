[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intelli_base"
version = "0.1.0"
description = "Корпоративная база знаний с использованием ИИ"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.29",
    "openai>=1.40",
    "redis>=5.0",
    "tenacity>=8.2",
    "arize-phoenix==17.3.0",
    "openinference-instrumentation-openai==0.1.51",
    "structlog==26.1.0",
    "aiofiles==25.1.0",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "tiktoken==0.13.0",
    "structlog>=24",
    "aiogram>=3.27.0",
    "telegramify_markdown==1.2.0",
    "aiohttp-socks>=0.11.0",
    "python-docx==1.2.0",
    "pypdf==6.14.2",
    "sqlalchemy==2.0.51",
    "httpx==0.28.1",
    "pyyaml>=6.0",
    "openai>=2.0,<3",
    "sentence-transformers>=3.0",
    "tenacity>=9.0",
    "tiktoken>=0.7",
    "diskcache>=5.6",
    "tqdm>=4.66",
    "qdrant-client>=1.18.0",
    "llama-index>=0.14.23",
    "llama-index-vector-stores-qdrant>=0.10.3",
    "llama-index-readers-file>=0.6.0",
    "llama-index-embeddings-huggingface>=0.7.0",
    "docx2txt>=0.9",
    "pymupdf>=1.28.2",
    "pyarrow>=18.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.25.0",
    "pyyaml>=6.0",
    "garak>=0.9.0",
]
# Трейсинг LlamaIndex в Phoenix — опциональный runtime-путь (PHOENIX_ENABLED=false).
# Ставится отдельно: `uv sync --extra tracing`. Без него сервис работает без спанов.
tracing = [
    "openinference-instrumentation-llama-index>=3,<4",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
# Офлайн-оценка качества RAG (scripts/run_eval.py, generate_testset.py) — тяжёлая
# группа, в проде не нужна. Ставится: `uv sync --extra eval`. langchain-community
# тянется ядром RAGAS; без верхней границы свежие 0.4.x ломают импорт vertexai.
eval = [
    "ragas>=0.4,<0.5",
    "langchain-community<0.4",
    "anthropic>=0.40",
    "pandas>=2",
    "arize-phoenix>=5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.25.0",
    "pyyaml>=6.0",
    "garak>=0.9.0",
]
tracing = [
    "openinference-instrumentation-llama-index>=3,<4",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
eval = [
    "ragas>=0.4,<0.5",
    "langchain-community<0.4",
    "anthropic>=0.40",
    "pandas>=2",
    "arize-phoenix>=5",
]

[project.urls]
Source = "https://github.com/vavstone/IntelliBase"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["app", "bot"]
